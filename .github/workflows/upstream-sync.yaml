name: Upstream Sync

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  cancel-in-progress: false
  group: upstream-sync

jobs:
  sync:
    name: Open Upstream Sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge Upstream & Open PR
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote add upstream https://github.com/tristmeister/HEISS-UI.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Already contains upstream changes.'
            exit 0
          fi
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git switch --create sync/upstream origin/main
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo '::error::Upstream conflicts with fork changes. Resolve manually; no branch was pushed.'
            exit 1
          fi
          git push --force-with-lease origin HEAD:refs/heads/sync/upstream
          if [ -z "$(gh pr list --base main --head sync/upstream --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base main --body 'Merge upstream changes while preserving this fork. Review the diff and Container checks before merging. Bento remains pinned until its source revision is updated.' --head sync/upstream --title 'Sync Upstream Changes'
          fi
          # Explicit dispatch runs verification for bot-created PRs without another token.
          gh workflow run container.yaml --ref sync/upstream
